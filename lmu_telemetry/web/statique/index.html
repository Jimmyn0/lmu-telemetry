<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GhostLine for LMU</title>
<link rel="stylesheet" href="/style.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 30 30'%3E%3Crect width='30' height='30' rx='8' fill='%231b2533'/%3E%3Cpath d='M5 18C11.5 18 11.5 8 20 8' fill='none' stroke='%23ee8a35' stroke-width='2.6' stroke-linecap='round'/%3E%3Cpath d='M5 24C13 24 13 13 24 13' fill='none' stroke='%23a25ee8' stroke-width='2.6' stroke-linecap='round'/%3E%3Ccircle cx='20' cy='8' r='2.3' fill='%23fff'/%3E%3Ccircle cx='24' cy='13' r='2.3' fill='%23fff'/%3E%3C/svg%3E">
</head>
<body>

<header id="barre-titre">
  <!-- Le nom de l'outil et son emblème, maison, pas le logo du jeu : deux trajectoires et
       leurs voitures, le tour comparé en orange et la référence en violet. Même dessin que
       tools/icone.py. -->
  <div class="marque">
    <svg class="embleme" viewBox="0 0 30 30" aria-hidden="true">
      <rect width="30" height="30" rx="8" fill="#1b2533"/>
      <path d="M5 18C11.5 18 11.5 8 20 8" fill="none" stroke="#ee8a35" stroke-width="2.6" stroke-linecap="round"/>
      <path d="M5 24C13 24 13 13 24 13" fill="none" stroke="#a25ee8" stroke-width="2.6" stroke-linecap="round"/>
      <circle cx="20" cy="8" r="2.3" fill="#fff"/>
      <circle cx="24" cy="13" r="2.3" fill="#fff"/>
    </svg>
    <span class="nom-appli">GhostLine<small>for LMU</small></span>
  </div>
  <button id="bascule-laterale" class="bouton-barre" type="button" data-t-title="nav.bascule"></button>
  <nav id="onglets">
    <button type="button" data-onglet="resultats" data-t="nav.resultats">Résultats</button>
    <button type="button" data-onglet="telemetrie" data-t="nav.telemetrie">Télémétrie</button>
    <button type="button" data-onglet="temps" data-t="nav.temps">Temps au tour</button>
    <button type="button" data-onglet="leaderboard" data-t="nav.leaderboard">Leaderboard</button>
  </nav>
  <div class="espace"></div>
  <button id="ouvrir-reglages" class="bouton-barre" type="button" data-t-title="reglages.titre"></button>
  <div id="controles-fenetre" hidden>
    <span class="separateur"></span>
    <button id="fenetre-reduire" class="bouton-barre" type="button" data-t-title="fenetre.reduire"></button>
    <button id="fenetre-agrandir" class="bouton-barre" type="button" data-t-title="fenetre.agrandir"></button>
    <button id="fenetre-fermer" class="bouton-barre fermer" type="button" data-t-title="fenetre.fermer"></button>
  </div>
</header>

<div id="corps">
  <aside id="laterale"></aside>

  <main id="contenu">

    <!-- Résultats : une session, son classement, ses tours et sa régularité -->
    <section id="ecran-resultats" hidden>
      <div id="entete-session"></div>
      <div id="sous-onglets" class="barre-onglets" hidden>
        <button type="button" data-vue="classement" data-t="session.onglet_classement">Classement</button>
        <button type="button" data-vue="rythme" data-t="session.onglet_rythme">Rythme</button>
        <button type="button" data-vue="positions" data-t="session.onglet_positions">Positions</button>
        <button type="button" data-vue="statistiques" data-t="session.onglet_statistiques">Statistiques</button>
        <button type="button" data-vue="incidents" data-t="session.onglet_incidents">Incidents</button>
        <button type="button" data-vue="chat" data-t="session.onglet_chat">Chat</button>
        <button type="button" data-vue="tours" data-t="session.onglet_tours">Tours</button>
        <button type="button" data-vue="regularite" data-t="session.onglet_regularite">Régularité</button>
      </div>
      <div id="vue-session"></div>
    </section>

    <!-- Télémétrie : deux tours superposés -->
    <section id="ecran-telemetrie" hidden>
      <div id="tele-vide"></div>
      <div id="tele-page" hidden>
        <div class="tele-haut">
          <div id="carte-ref" class="carte-tour ref"></div>
          <div id="carte-cmp" class="carte-tour cmp"></div>
          <div id="outils-tele" class="outils"></div>
        </div>
        <div class="transport">
          <div class="transport-lecture">
            <button id="lecture" class="bouton-carre" type="button" data-t-title="tele.lecture"></button>
            <span id="temps-lecture" class="valeur-temps">0:00.000</span>
          </div>
          <div id="frise" class="frise"></div>
          <div class="transport-droite">
            <span id="temps-total" class="valeur-temps"></span>
            <select id="vitesse-lecture" data-t-title="tele.vitesse_lecture">
              <option value="0.25">0,25×</option>
              <option value="0.5">0,5×</option>
              <option value="1" selected>1×</option>
              <option value="2">2×</option>
              <option value="4">4×</option>
            </select>
          </div>
        </div>
        <div id="avertissements" hidden></div>
        <div class="tele-corps">
          <div class="tele-gauche">
            <div id="graphiques"></div>
            <section id="bloc-virages">
              <h3 class="titre-section" data-t="virages.titre">Virage par virage</h3>
              <div id="entete-virages" class="note"></div>
              <div id="table-virages" class="carte tableau"></div>
            </section>
          </div>
          <aside class="tele-cote">
            <div class="carte bloc-carte">
              <div class="titre-carte" id="titre-carte"></div>
              <div class="toile-carte">
                <canvas id="carte-fond"></canvas>
                <canvas id="carte-calque"></canvas>
              </div>
              <div id="modes-carte" class="modes-carte"></div>
            </div>
            <div id="bloc-chronos" class="carte"></div>
            <h3 class="titre-section" data-t="tele.secteurs">Secteurs</h3>
            <div id="bloc-secteurs" class="grille-secteurs"></div>
            <div id="bloc-vitesses" class="grille-deux"></div>
            <div id="bloc-carburant" class="grille-deux"></div>
            <div class="carte bloc-route">
              <div class="titre-route">
                <strong data-t="piste.titre">Vue de la route</strong>
                <select id="fenetre-piste">
                  <option value="40">40 m</option>
                  <option value="80" selected>80 m</option>
                  <option value="160">160 m</option>
                  <option value="320">320 m</option>
                </select>
              </div>
              <canvas id="vue-piste"></canvas>
              <div id="note-piste" class="note"></div>
            </div>
          </aside>
        </div>
      </div>
    </section>

    <!-- Temps au tour : les records par circuit -->
    <section id="ecran-temps" hidden></section>

    <!-- Leaderboard : les meilleurs tours et les courses de chaque pilote du groupe -->
    <section id="ecran-leaderboard" hidden></section>

    <!-- Choisir le dossier de télémétrie, quand il n'a pas été trouvé tout seul -->
    <section id="ecran-dossier" hidden>
      <div class="carte carte-dossier">
        <h2 data-t="dossier.titre">Où sont tes sessions ?</h2>
        <p id="message-dossier" class="message-dossier"></p>
        <div class="saisie-dossier">
          <input id="saisie-dossier" type="text" spellcheck="false" autocomplete="off"
                 placeholder="D:\SteamLibrary\steamapps\common\Le Mans Ultimate\UserData\Telemetry">
          <button id="valider-dossier" type="button" class="principal" data-t="dossier.valider">Utiliser ce dossier</button>
          <button id="annuler-dossier" type="button" hidden data-t="dossier.annuler">Annuler</button>
        </div>
        <p id="erreur-dossier" class="erreur-dossier" hidden></p>
        <div class="aide" data-t-html="dossier.aide"></div>
      </div>
    </section>
  </main>
</div>

<div id="reglages" class="panneau" hidden></div>

<div id="erreur" role="alert" hidden>
  <span id="erreur-texte"></span>
  <button id="erreur-fermer" type="button" data-t-title="erreur.fermer">×</button>
</div>

<!-- Bords de la fenêtre : sans bordure, c'est la page qui les fournit. -->
<div id="poignees" hidden>
  <div data-bord="n"></div><div data-bord="s"></div><div data-bord="e"></div><div data-bord="o"></div>
  <div data-bord="no"></div><div data-bord="ne"></div><div data-bord="so"></div><div data-bord="se"></div>
</div>

<script type="module" src="/app.js"></script>
</body>
</html>
